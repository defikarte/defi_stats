<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Defibrillatoren — defikarte.ch</title>
  <!-- Die Seite wird beim Deploy auch als /<id>/index.html ausgeliefert; Pfade beziehen sich immer auf /reports/ -->
  <base href="/reports/">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="report.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="report.js"></script>
</head>
<body>

<header>
  <a class="logo-img" href="https://defikarte.ch" target="_blank"><img src="logo.svg" alt="defikarte.ch"></a>
  <div class="header-right">
    <span class="header-client" id="header-client" hidden></span>
    <span class="header-tag" id="header-tag">Report</span>
  </div>
</header>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-eyebrow" id="eyebrow" hidden></div>
    <h1 id="title">Defibrillatoren</h1>
    <p class="hero-sub" id="subtitle">Auswertung pro Gemeinde · Daten aus OpenStreetMap</p>
    <div class="stats" id="stats"></div>
    <div class="source-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
      <span id="source">defikarte/defi_data</span>
    </div>
  </div>
</div>

<div class="main">
  <div class="tab-row" id="tabs"></div>
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" id="search" type="text" placeholder="Gemeinde suchen…">
    </div>
    <span class="result-count" id="result-count"></span>
    <button class="btn btn-outline" id="pdf-btn" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      PDF exportieren
    </button>
    <button class="btn btn-outline" id="csv-btn" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      CSV exportieren
    </button>
  </div>
  <div class="table-card">
    <div class="table-wrap" id="table-wrap">
      <div class="loading"><div class="spinner"></div><span id="load-msg">Daten werden geladen…</span></div>
    </div>
  </div>
</div>

<footer>
  Datenquelle: <a href="https://github.com/defikarte/defi_data" target="_blank">defikarte/defi_data</a> ·
  <a href="https://www.openstreetmap.org" target="_blank">OpenStreetMap</a> ·
  <a href="https://defikarte.ch" target="_blank">defikarte.ch</a> ·
  Gemeindegrenzen: <a href="https://www.bfs.admin.ch" target="_blank">BFS</a>
  <br><br><span id="last-updated"></span>
</footer>

</body>
</html>
