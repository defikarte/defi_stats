name: Update Defibrillator Statistics

on:
  schedule:
    # Läuft am 1. jeden Monats um 09:00 UTC (10:00 CET / 11:00 CEST)
    - cron: '0 9 1 * *'
  workflow_dispatch: # Erlaubt manuelles Auslösen

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Fetch Defibrillator Data (Schweizer Kantone)
        run: |
          # Liste aller Schweizer Kantone
          CANTONS="ag ai ar be bl bs fr ge gl gr ju lu ne nw ow sg sh so sz tg ti ur vd vs zg zh"
          
          TOTAL=0
          
          for CANTON in $CANTONS; do
            echo "Fetching ${CANTON}..."
            URL="https://cdn.jsdelivr.net/gh/OpenBracketsCH/defi_data@main/data/json/defis_kt_${CANTON}.geojson"
            
            # Lade GeoJSON und zähle Features
            COUNT=$(curl -s "$URL" | jq '.features | length')
            
            if [ ! -z "$COUNT" ] && [ "$COUNT" -gt 0 ]; then
              echo "  ${CANTON}: ${COUNT} Defis"
              TOTAL=$((TOTAL + COUNT))
            else
              echo "  ${CANTON}: Fehler beim Laden"
            fi
          done
          
          echo "TOTAL_DEFIS=$TOTAL" >> $GITHUB_ENV
          echo "Gesamtzahl: $TOTAL Defibrillatoren"

      - name: Fetch Defibrillator Data (Nachbarländer via Overpass)
        run: |
          TODAY=$(date +%Y-%m-%d)
          
          # Overpass-Endpunkte (Fallback)
          ENDPOINTS=(
            "https://overpass.private.coffee/api/interpreter"
            "https://overpass-api.de/api/interpreter"
            "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
          )

          fetch_country() {
            local ISO=$1
            local QUERY="[out:json][timeout:60];(area[\"ISO3166-1\"=\"${ISO}\"];area[\"ISO3166-1:alpha2\"=\"${ISO}\"];)->.a;node[\"emergency\"=\"defibrillator\"](area.a);out count;"
            for EP in "${ENDPOINTS[@]}"; do
              RESULT=$(curl -s --max-time 90 -X POST "$EP" --data-urlencode "data=${QUERY}" 2>/dev/null)
              COUNT=$(echo "$RESULT" | jq -r '.elements[0].tags.total // "0"' 2>/dev/null)
              if [ ! -z "$COUNT" ] && [ "$COUNT" -gt 0 ]; then
                echo "$COUNT"
                return
              fi
            done
            echo "0"
          }

          echo "Fetching Nachbarländer..."

          CH=$(fetch_country "CH")
          DE=$(fetch_country "DE")
          AT=$(fetch_country "AT")
          FR=$(fetch_country "FR")
          IT=$(fetch_country "IT")
          LI=$(fetch_country "LI")

          echo "  CH: $CH | DE: $DE | AT: $AT | FR: $FR | IT: $IT | LI: $LI"

          # Schreibe europe-data.json
          cat > europe-data.json << EOF
          {
            "updated": "${TODAY}",
            "countries": {
              "CH": $CH,
              "DE": $DE,
              "AT": $AT,
              "FR": $FR,
              "IT": $IT,
              "LI": $LI
            }
          }
          EOF

          echo "✅ europe-data.json geschrieben"
      
      - name: Update historical-data.json
        run: |
          # Heutiges Datum (YYYY-MM-DD)
          TODAY=$(date +%Y-%m-%d)
          
          # Lese existierende Daten
          HISTORICAL=$(cat historical-data.json)
          
          # Prüfe ob heute schon existiert
          EXISTS=$(echo "$HISTORICAL" | jq --arg date "$TODAY" '.[] | select(.date == $date) | .date')
          
          if [ -z "$EXISTS" ]; then
            # Füge neuen Eintrag hinzu
            echo "$HISTORICAL" | jq --arg date "$TODAY" --argjson count "$TOTAL_DEFIS" \
              '. += [{"date": $date, "count": $count}] | sort_by(.date)' \
              > historical-data.json
            
            echo "✅ Neuer Eintrag hinzugefügt: $TODAY → $TOTAL_DEFIS Defis"
            echo "UPDATE_MADE=true" >> $GITHUB_ENV
          else
            echo "ℹ️ Eintrag für $TODAY existiert bereits"
            echo "UPDATE_MADE=true" >> $GITHUB_ENV  # europe-data.json immer deployen
          fi
      
      - name: Commit and Push
        if: env.UPDATE_MADE == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          
          git add historical-data.json europe-data.json
          git commit -m "📊 Automatisches Update: $(date +%Y-%m-%d) - $TOTAL_DEFIS Defibrillatoren"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JSON-Dateien via FTP
        if: env.UPDATE_MADE == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_PATH }}
          exclude: |
            **/*
            !historical-data.json
            !europe-data.json

