name: Deploy stats.defikarte.ch

on:
  push:
    branches: [main]
  workflow_dispatch: # Erlaubt manuelles Auslösen
  # Commits der Update-Workflows (mit GITHUB_TOKEN) lösen kein "push" aus – deshalb hier nachziehen
  workflow_run:
    workflows:
      - Update Defibrillator Statistics
      - Update Europe Defibrillator Data
      - Update Gemeindegrenzen
    types: [completed]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Versionsnummer an JS/CSS hängen (Browser laden nach jedem Deploy neu)
        run: |
          V=$(git rev-parse --short HEAD)
          # HTML: lokale Skripte und Stylesheets (externe URLs mit ":" bleiben unverändert)
          find . -name '*.html' -not -path './archive/*' -not -path './.git/*' -print0 \
            | xargs -0 sed -i -E "s#(src|href)=\"([^\":?]+\.(js|css))\"#\1=\"\2?v=$V\"#g"
          # JS: relative Imports, damit jedes Modul genau einmal (in derselben Version) geladen wird
          find assets reports -name '*.js' -print0 \
            | xargs -0 sed -i -E "s#(from |import\()'(\.{1,2}/[^'?]+\.js)'#\1'\2?v=$V'#g"
          grep -rhoE "[a-z/._-]+\.(js|css)\?v=$V" --include=*.html --include=*.js . | sort -u

      - name: Report-Seiten erzeugen (/<id>/ für jeden Eintrag in reports.json)
        run: |
          for ID in $(jq -r 'keys[]' reports/reports.json); do
            mkdir -p "$ID"
            cp reports/index.html "$ID/index.html"
            echo "  /$ID/"
          done

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_PATH }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            .github/**
            archive/**
            scripts/**
            README.md
            LICENSE
            screenshot.png
            defikarte-praesentation.html
